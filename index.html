<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery - TeraBox</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header Area - Native/Social Banner Ad -->
    <header class="header-banner">
        <script async="async" data-cfasync="false" src="https://pl28400993.effectivegatecpm.com/d2fa428abe351bbce571e848e4166e8d/invoke.js"></script>
        <div id="container-d2fa428abe351bbce571e848e4166e8d"></div>
    </header>

    <div class="main-container">
        <!-- Left Sidebar - Skyscraper Banner (600x160) -->
        <aside class="sidebar sidebar-left">
            <div class="ad-container">
                <script>
                    atOptions = {
                        'key' : 'c4ecf77578eb642f74a23e2a6f050b51',
                        'format' : 'iframe',
                        'height' : 600,
                        'width' : 160,
                        'params' : {}
                    };
                </script>
                <script src="https://www.highperformanceformat.com/c4ecf77578eb642f74a23e2a6f050b51/invoke.js"></script>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            <div class="gallery-container">
                <div id="gallery-grid" class="gallery-grid">
                    <!-- Thumbnails will be dynamically inserted here -->
                </div>
                <div id="loading-indicator" class="loading-indicator">
                    <div class="spinner"></div>
                    <p>Loading more videos...</p>
                </div>
            </div>
        </main>

        <!-- Right Sidebar - Skyscraper Banner (300x160) -->
        <aside class="sidebar sidebar-right">
            <div class="ad-container">
                <script>
                    atOptions = {
                        'key' : '80452d4c78311386b34467a0adc50169',
                        'format' : 'iframe',
                        'height' : 300,
                        'width' : 160,
                        'params' : {}
                    };
                </script>
                <script src="https://www.highperformanceformat.com/80452d4c78311386b34467a0adc50169/invoke.js"></script>
            </div>
        </aside>
    </div>

    <!-- Ad popup (shown twice per video click with 5s countdown) -->
    <div id="ad-popup-overlay" class="ad-popup-overlay hidden">
        <div class="ad-popup-content">
            <div class="ad-popup-ad-slot" id="ad-popup-slot">
                <!-- Ad for current stage will be injected here -->
            </div>
            <div class="ad-popup-timer-badge">
                <span id="ad-popup-timer">15</span>s
            </div>
            <button id="ad-popup-close-btn" class="ad-popup-close-btn">
                ×
            </button>
        </div>
    </div>

    <!-- Simple popup to show the actual video URL and confirm visiting in current page -->
    <div id="video-url-modal" class="video-url-modal hidden">
        <div class="video-url-modal-content">
            <h2 class="video-url-title">Ready to Watch</h2>
            <p class="video-url-message">Click below to open this video URL in this page.</p>
            <p id="video-url-text" class="video-url-text"></p>
            <button id="video-url-visit-btn" class="video-url-visit-btn">Visit URL in this page</button>
            <button id="video-url-close-btn" class="video-url-close-btn">Close</button>
        </div>
    </div>

    <!-- Footer Area -->
    <footer class="footer-banner">
        <!-- Additional footer banner (skyscraper unit reused) -->
        <script>
            atOptions = {
                'key' : '80452d4c78311386b34467a0adc50169',
                'format' : 'iframe',
                'height' : 300,
                'width' : 160,
                'params' : {}
            };
        </script>
        <script src="https://www.highperformanceformat.com/80452d4c78311386b34467a0adc50169/invoke.js"></script>
    </footer>

    <!-- Popunder scripts (loaded once on the homepage) -->
    <script src="https://pl28400957.effectivegatecpm.com/a5/3a/04/a53a04830edc924275e1959d962ab7da.js"></script>
    <script src="https://pl28400976.effectivegatecpm.com/b1/a5/5b/b1a55b6c433993ed2e5cb29e9bb0ffbe.js"></script>

    <script src="js/script.js"></script>
</body>
</html>
