<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visit Video - TeraBox</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .redirect-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .redirect-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .redirect-title {
            font-size: 28px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        .redirect-message {
            font-size: 16px;
            margin-bottom: 30px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        .visit-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            width: 100%;
            max-width: 300px;
        }
        .visit-button:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }
        .visit-button:active {
            transform: scale(0.98);
        }
        .countdown {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 20px;
        }
        .video-id {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 15px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-card">
            <h1 class="redirect-title">Ready to Watch</h1>
            <p class="redirect-message">Click the button below to visit the video on TeraBox</p>
            
            <button class="visit-button" id="visitButton">Visit Video URL</button>
            
            <div class="countdown" id="countdown">Auto-redirecting in <span id="timer">3</span> seconds...</div>
            <div class="video-id" id="videoId"></div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('url');
        const videoId = urlParams.get('id');

        let countdown = 3;
        let redirectTimer;

        // Display video ID if available
        if (videoId) {
            const videoIdElement = document.getElementById('videoId');
            if (videoIdElement) {
                videoIdElement.textContent = `Video ID: ${videoId}`;
            }
        }

        // Update countdown display
        function updateCountdown() {
            const timerElement = document.getElementById('timer');
            if (timerElement) {
                timerElement.textContent = countdown;
            }
        }

        // Redirect function
        function redirect() {
            if (redirectUrl) {
                window.location.href = redirectUrl;
            } else {
                // Fallback: redirect to homepage if no URL provided
                window.location.href = 'index.html';
            }
        }

        // Start countdown timer
        function startCountdown() {
            updateCountdown();
            redirectTimer = setInterval(() => {
                countdown--;
                updateCountdown();
                if (countdown <= 0) {
                    clearInterval(redirectTimer);
                    redirect();
                }
            }, 1000);
        }

        // Visit button handler
        const visitButton = document.getElementById('visitButton');
        if (visitButton) {
            visitButton.addEventListener('click', () => {
                clearInterval(redirectTimer);
                redirect();
            });
        }

        // Start countdown on page load
        if (redirectUrl) {
            startCountdown();
        } else {
            // If no URL provided, redirect to homepage after 3 seconds
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        }
    </script>
</body>
</html>
